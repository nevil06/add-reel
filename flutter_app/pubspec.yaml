name: addreel_flutter
description: AdReel - Video Ads Platform (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  
  # Video Player
  video_player: ^2.8.2
  chewie: ^1.7.5
  
  # AdMob
  google_mobile_ads: ^7.0.0
  
  # Other Ad Networks
  unity_ads_plugin: ^0.3.8
  facebook_audience_network: ^1.0.1
  
  # Surveys
  bitlabs: ^4.1.0
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # State Management
  provider: ^6.1.1
  
  # Image Caching
  cached_network_image: ^3.3.1
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0
  
  # Intl for formatting
  intl: ^0.20.2
  
  # Device Info for fingerprinting
  device_info_plus: ^12.3.0
  
  # Crypto for hashing
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

